<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forja</title>
<meta name="description" content="Academia estilo RPG: seu herói evolui com o seu treino.">
<meta name="theme-color" content="#16181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forja">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topo">
    <div class="marca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c2.6 3.2 5.5 5 5.5 9.6a5.5 5.5 0 0 1-11 0c0-2.4 1.2-4.1 2.4-5 .1 1.8.8 3 1.9 3.6-.5-3.4.2-5.9 1.2-8.2z" fill="#d9693a"/><path d="M3 20.5h18" stroke="#c6a06a" stroke-width="2" stroke-linecap="round"/></svg>FORJA</div>
    <button class="chip-nivel" id="chip-nivel" data-ir="perfil">Nv 7</button>
  </header>
  <main>
    <section class="tela ativa" id="tela-heroi"></section>
    <section class="tela" id="tela-treinos"></section>
    <section class="tela" id="tela-progresso"></section>
    <section class="tela" id="tela-amigos"></section>
    <section class="tela" id="tela-perfil"></section>
  </main>
  <nav class="barra-nav" id="barra-nav">
    <button class="ativo" data-ir="heroi"><svg viewBox="0 0 24 24"><path d="M12 3.5c2 2.5 4.2 3.9 4.2 7.4a4.2 4.2 0 0 1-8.4 0c0-1.8.9-3.1 1.8-3.8.1 1.4.6 2.3 1.4 2.8-.3-2.6.2-4.5 1-6.4z"/><path d="M5 20.5h14"/></svg><span>Herói</span></button>
    <button data-ir="treinos"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Treinos</span></button>
    <button data-ir="progresso"><svg viewBox="0 0 24 24"><path d="M4 19.5h16M6.5 16l4-5 3 3 4.5-6.5"/></svg><span>Progresso</span></button>
    <button data-ir="amigos"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.4-3.3 2.7-5.3 5.5-5.3s5.1 2 5.5 5.3"/><path d="M15.5 5.6a3 3 0 0 1 0 5.8M17.4 14.5c1.7.6 2.8 2.3 3.1 5"/></svg><span>Amigos</span></button>
    <button data-ir="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.6-3.8 3.4-6 7-6s6.4 2.2 7 6"/></svg><span>Perfil</span></button>
  </nav>
</div>
<div id="folhas"></div>
<div class="descanso oculto" id="descanso"></div>
<div class="modal oculto" id="modal"><div class="modal-caixa" id="modal-caixa"></div></div>
<div class="toast" id="toast"></div>
<div class="confete" id="confete"></div>
<script src="acessorios.js"></script>
<script src="gato.js"></script>
<script src="cenarios.js"></script>
<script src="anim.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
