<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forja</title>
<meta name="description" content="Academia estilo RPG: seu herói evolui com o seu treino.">
<meta name="theme-color" content="#0f0d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forja">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topo">
    <div class="marca"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c4 5 9 7 9 15a9 9 0 0 1-18 0c0-4 2-7 4-8 0 3 1 5 3 6-1-6 0-10 2-13z" fill="#ff8a3d"/><path d="M16 14c2 3 4 4 4 7a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 2 2 3 0-3-1-4 0-6z" fill="#ffd36e"/></svg>Forja</div>
    <button class="chip-nivel" id="chip-nivel" data-ir="perfil">Nv 7</button>
  </header>
  <main>
    <section class="tela ativa" id="tela-heroi"></section>
    <section class="tela" id="tela-treinos"></section>
    <section class="tela" id="tela-progresso"></section>
    <section class="tela" id="tela-amigos"></section>
    <section class="tela" id="tela-perfil"></section>
  </main>
  <nav class="barra-nav" id="barra-nav">
    <button class="ativo" data-ir="heroi"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-5 4-8 8-8s8 3 8 8z"/></svg><span>Herói</span></button>
    <button data-ir="treinos"><svg viewBox="0 0 24 24"><rect x="1" y="9" width="4" height="6" rx="1.5"/><rect x="19" y="9" width="4" height="6" rx="1.5"/><rect x="5" y="6" width="3" height="12" rx="1.5"/><rect x="16" y="6" width="3" height="12" rx="1.5"/><rect x="8" y="11" width="8" height="2" rx="1"/></svg><span>Treinos</span></button>
    <button data-ir="progresso"><svg viewBox="0 0 24 24"><rect x="3" y="13" width="4" height="8" rx="1.5"/><rect x="10" y="8" width="4" height="13" rx="1.5"/><rect x="17" y="3" width="4" height="18" rx="1.5"/></svg><span>Progresso</span></button>
    <button data-ir="amigos"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.5"/><circle cx="17" cy="9" r="3"/><path d="M1 20c0-4 3-7 7-7s7 3 7 7z"/><path d="M14 20c0-2 0-4-1.5-5.5C14 13.5 15.5 13 17 13c3.5 0 6 2.5 6 7z" opacity=".6"/></svg><span>Amigos</span></button>
    <button data-ir="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2l2 3 3.5-.8.8 3.5 3 2-2 3 .8 3.5-3.5.8-2 3-3-2-3 2-2-3-3.5-.8.8-3.5-2-3 3-2 .8-3.5L10 5z" opacity=".4"/></svg><span>Perfil</span></button>
  </nav>
</div>
<div id="folhas"></div>
<div class="descanso oculto" id="descanso"></div>
<div class="modal oculto" id="modal"><div class="modal-caixa" id="modal-caixa"></div></div>
<div class="toast" id="toast"></div>
<div class="confete" id="confete"></div>
<script src="char.js"></script>
<script src="anim.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
